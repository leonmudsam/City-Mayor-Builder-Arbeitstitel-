name: CI

# v0.35 platform pivot: GitHub Pages is no longer a target (the game ships as a
# native Tauri desktop app, built locally/in a release pipeline). GitHub is used
# only for version control, backups and collaboration — so CI just guards quality:
# lint, typecheck, tests and a production build. No deployment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
